<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SB Shell / Mogwai</title>
<style>
body{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;margin:0;background:#111;color:#ddd}
header{padding:12px 16px;border-bottom:1px solid #333;position:sticky;top:0;background:#111}
main{display:grid;grid-template-columns:minmax(240px,32%) 1fr;min-height:calc(100vh - 48px)}
#tree{border-right:1px solid #333;padding:12px;overflow:auto}
#view{padding:18px;overflow:auto}
#view pre{margin:0 0 1.25rem 0;white-space:pre-wrap;font:inherit}
button{font:inherit;color:#ddd;background:#181818;border:1px solid #444;padding:6px 8px;margin:2px;cursor:pointer}
button:hover{background:#252525}
.meta{opacity:.6;font-size:.85em}
.section{margin:12px 2px 5px;opacity:.55;font-size:.8em;text-transform:uppercase;letter-spacing:.08em}
@media(max-width:700px){main{grid-template-columns:1fr}#tree{border-right:0;border-bottom:1px solid #333}}
</style>
</head>
<body>
<header><strong>SB Shell / Mogwai</strong> <span id="where" class="meta"></span></header>
<main>
  <section id="tree"></section>
  <section id="view"><pre>Select a page or file.</pre></section>
</main>
<script>
const tree = document.querySelector("#tree");
const view = document.querySelector("#view");
const where = document.querySelector("#where");

let current = "";
let entries = [];

function stateFromUrl() {
  const q = new URLSearchParams(location.search);
  return {
    path: q.get("path") || "",
    page: q.get("page") || ""
  };
}

function writeUrl(path, page="", replace=false) {
  const q = new URLSearchParams();
  if (path) q.set("path", path);
  if (page) q.set("page", page);
  const url = location.pathname + (q.toString() ? "?" + q.toString() : "");
  history[replace ? "replaceState" : "pushState"]({path, page}, "", url);
}

function heading(text) {
  const d = document.createElement("div");
  d.className = "section";
  d.textContent = text;
  tree.append(d);
}

function addButton(text, onclick) {
  const b = document.createElement("button");
  b.textContent = text;
  b.onclick = onclick;
  tree.append(b, document.createElement("br"));
}

async function list(path="", page="", replace=false) {
  const r = await fetch("/api/list?path=" + encodeURIComponent(path));
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || "list failed");

  current = data.path;
  entries = data.entries;
  where.textContent = data.root + (data.path ? "/" + data.path : "");
  tree.innerHTML = "";

  writeUrl(current, page, replace);

  if (current) {
    addButton("..", () => list(current.split("/").slice(0,-1).join("/")));
  }

  const dirs = entries.filter(e => e.type === "dir");
  const files = entries.filter(e => e.type === "file");

  for (const entry of dirs) {
    const ordinal = entry.coordinate ? "[" + entry.coordinate + "] " : "";
    addButton("▸ " + ordinal + entry.name, () => list(entry.path));
  }

  const pageGroups = new Map();
  const loose = [];

  for (const entry of files) {
    if (entry.ordinals && entry.ordinals.length >= 2) {
      const pageNo = entry.ordinals[0];
      if (!pageGroups.has(pageNo)) pageGroups.set(pageNo, []);
      pageGroups.get(pageNo).push(entry);
    } else {
      loose.push(entry);
    }
  }

  if (pageGroups.size) {
    heading("pages");
    for (const [pageNo, pageEntries] of pageGroups) {
      const label = "[" + pageNo + "] " + pageEntries.map(e => e.name).join(" + ");
      addButton(label, () => loadPage(pageNo));
    }
  }

  if (loose.length) {
    heading("files");
    for (const entry of loose) {
      const ordinal = entry.coordinate ? "[" + entry.coordinate + "] " : "";
      addButton(ordinal + entry.name, () => load(entry.path));
    }
  }

  if (page && pageGroups.has(page)) {
    await loadPage(page, true);
  } else if (!page) {
    showMessage("Select a page or file.");
  }
}

function showMessage(text) {
  view.innerHTML = "";
  const pre = document.createElement("pre");
  pre.textContent = text;
  view.append(pre);
}

async function loadText(path) {
  const r = await fetch("/api/load?path=" + encodeURIComponent(path));
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || "load failed");
  return data;
}

async function load(path) {
  writeUrl(current);
  try {
    const data = await loadText(path);
    view.innerHTML = "";
    const pre = document.createElement("pre");
    pre.textContent = data.content;
    view.append(pre);
  } catch (err) {
    showMessage(err.message);
  }
}

async function loadPage(pageNo, fromRestore=false) {
  const pageEntries = entries
    .filter(e => e.type === "file" && e.ordinals && e.ordinals.length >= 2 && e.ordinals[0] === pageNo)
    .sort((a,b) => a.name.localeCompare(b.name));

  if (!fromRestore) writeUrl(current, pageNo);

  view.innerHTML = "";

  for (const entry of pageEntries) {
    const pre = document.createElement("pre");
    try {
      const data = await loadText(entry.path);
      pre.textContent = data.content;
    } catch (err) {
      pre.textContent = "[" + entry.name + "] " + err.message;
    }
    view.append(pre);
  }
}

window.addEventListener("popstate", () => {
  const state = stateFromUrl();
  list(state.path, state.page, true).catch(err => showMessage(err.message));
});

const initial = stateFromUrl();
list(initial.path, initial.page, true).catch(err => showMessage(err.message));
</script>
</body>
</html>
